name: Update file (random 1-5hr gaps, weekdays)

on:
  schedule:
    - cron: "0 * * * 1-5"   # checks every hour, Monday–Friday; script decides if it's due
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update today's file
        run: python scripts/update_daily_file.py